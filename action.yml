name: "TicketToCode Agent"
description: "AI agent that executes Jira task plans — reads files, applies changes via Claude, validates, and opens a PR."
author: "pranavsriram8"

branding:
  icon: "git-pull-request"
  color: "blue"

inputs:
  github-token:
    description: "GitHub token for creating branches and PRs"
    required: true
  jira-issue-key:
    description: "Jira issue key (e.g., INFRA-42)"
    required: true
  task-title:
    description: "Task title / summary"
    required: true
  task-type:
    description: "Classified task type (terraform, helm, ansible, service, script)"
    required: true
  target-paths:
    description: "Comma-separated target file/directory paths in the monorepo"
    required: true
  plan:
    description: "Step-by-step execution plan generated by DSPy router"
    required: true
  validation-commands:
    description: "Comma-separated safe validation commands"
    required: false
    default: ""
  model:
    description: "LiteLLM model string (e.g., bedrock/eu.anthropic.claude-sonnet-4-6)"
    required: false
    default: "bedrock/eu.anthropic.claude-sonnet-4-6"
  aws-access-key-id:
    description: "AWS Access Key ID (for Bedrock)"
    required: false
  aws-secret-access-key:
    description: "AWS Secret Access Key (for Bedrock)"
    required: false
  aws-region:
    description: "AWS region for Bedrock"
    required: false
    default: "eu-west-1"
  base-branch:
    description: "Base branch for the PR"
    required: false
    default: "master"
  git-author-name:
    description: "Git author name for commits (e.g., 'TicketToCode Agent')"
    required: false
    default: "TicketToCode Agent"
  git-author-email:
    description: "Git author email for commits (e.g., 'devops@company.com')"
    required: false
    default: "ticket-to-code-agent@noreply.github.com"

runs:
  using: "docker"
  image: "docker://ghcr.io/pranavsriram8/ticket-to-code/executor:latest"
  env:
    GITHUB_TOKEN: ${{ inputs.github-token }}
    INPUT_JIRA_ISSUE_KEY: ${{ inputs.jira-issue-key }}
    INPUT_TASK_TITLE: ${{ inputs.task-title }}
    INPUT_TASK_TYPE: ${{ inputs.task-type }}
    INPUT_TARGET_PATHS: ${{ inputs.target-paths }}
    INPUT_PLAN: ${{ inputs.plan }}
    INPUT_VALIDATION_COMMANDS: ${{ inputs.validation-commands }}
    INPUT_MODEL: ${{ inputs.model }}
    INPUT_BASE_BRANCH: ${{ inputs.base-branch }}
    INPUT_GIT_AUTHOR_NAME: ${{ inputs.git-author-name }}
    INPUT_GIT_AUTHOR_EMAIL: ${{ inputs.git-author-email }}
    AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
    AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
    AWS_DEFAULT_REGION: ${{ inputs.aws-region }}
