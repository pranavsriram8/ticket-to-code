# Builds and pushes both TicketToCode Docker images to GHCR on release.
# Triggered when a version tag (v*) is pushed.
#
# Images produced:
#   ghcr.io/pranavsriram8/ticket-to-code/coordinator:<version> + :latest
#   ghcr.io/pranavsriram8/ticket-to-code/executor:<version> + :latest
#
# Usage:
#   git tag v0.1.0
#   git push origin v0.1.0

name: "Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  coordinator:
    name: "Build coordinator (Agent 1)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Log in to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Extract metadata"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/coordinator
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: "Build and push"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=coordinator
          cache-to: type=gha,scope=coordinator,mode=max

      - name: "Scan for vulnerabilities"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/coordinator:latest
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  executor:
    name: "Build executor (Agent 2)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Log in to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Extract metadata"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/executor
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: "Build and push"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.action
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=executor
          cache-to: type=gha,scope=executor,mode=max

      - name: "Scan for vulnerabilities"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/executor:latest
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
